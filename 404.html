<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        // GitHub Pages SPA redirect
        // Preserves the path so client-side routing can handle it
        const path = window.location.pathname;
        const search = window.location.search;
        const hash = window.location.hash;

        // Redirect to index.html with the original path preserved
        // The path will be read by JavaScript on load
        sessionStorage.setItem('redirect', path + search + hash);
        window.location.replace('/');
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
